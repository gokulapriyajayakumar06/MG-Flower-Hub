
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MG Flower Hub - Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#FFFAF5;
    color:#49332F;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:40px 35px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(73,51,47,.10);
    border:1px solid #F1E4DF;
}

.logo{
    text-align:center;
    font-family:'Playfair Display',serif;
    color:#603D38;
    font-size:27px;
    margin-bottom:12px;
}

.flower{
    text-align:center;
    font-size:38px;
    margin-bottom:15px;
}

h1{
    text-align:center;
    font-family:'Playfair Display',serif;
    font-size:29px;
    margin-bottom:8px;
    color:#603D38;
}

.subtitle{
    text-align:center;
    font-size:13px;
    color:#987B74;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    font-size:13px;
    font-weight:500;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #E3D3CD;
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    outline:none;
}

input:focus{
    border-color:#B8757D;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#603D38;
    color:white;
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
}

button:hover{
    background:#B8757D;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#errorMessage{
    display:none;
    color:#A33A3A;
    background:#FCE4E4;
    padding:12px;
    border-radius:7px;
    font-size:12px;
    margin-bottom:18px;
    line-height:1.6;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#B8757D;
    text-decoration:none;
    font-size:13px;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">MG FLOWER HUB</div>

    <div class="flower">🌸</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        Welcome back! Login to manage your flower hub.
    </p>

    <div id="errorMessage"></div>

    <form id="loginForm">

        <div class="form-group">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                value="mgflowerhub@gmail.com"
                required
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit" id="loginButton">
            LOGIN TO DASHBOARD
        </button>

    </form>

    <a href="index.html" class="back-link">
        ← Back To Website
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>

<script>

const ADMIN_EMAIL = "mgflowerhub@gmail.com";

const ADMIN_UID = "3887b154-29d3-4819-b7e9-dff137d02367";

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const errorMessage = document.getElementById("errorMessage");

loginForm.addEventListener("submit", async function(e){

    e.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    errorMessage.style.display = "none";

    if(email !== ADMIN_EMAIL){

        errorMessage.textContent = "This account is not authorized as admin.";
        errorMessage.style.display = "block";
        return;

    }

    loginButton.disabled = true;
    loginButton.textContent = "LOGGING IN...";

    try{

        const { data, error } =
            await window.supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if(error){
            throw error;
        }

        if(!data.user || data.user.id !== ADMIN_UID){

            await window.supabaseClient.auth.signOut();

            throw new Error("This account is not authorized as admin.");

        }

        window.location.replace("admin-dashboard.html");

    }catch(error){

        errorMessage.textContent =
            error.message || "Login failed. Please try again.";

        errorMessage.style.display = "block";

    }finally{

        loginButton.disabled = false;
        loginButton.textContent = "LOGIN TO DASHBOARD";

    }

});

</script>

</body>
</html>
